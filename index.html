<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5b5ef4">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Latein-Trainer</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#23264a;--soft:#6b6f95;--pri:#5b5ef4;--pri2:#4144d6;--ok:#12b886;--ok2:#0b8f67;--okbg:#d3f9e8;--bad:#f03e5f;--badbg:#ffe0e6;--line:#e3e5f3;--yel:#ffb703}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.screen{display:none;min-height:100%;flex-direction:column;padding:16px;max-width:560px;margin:0 auto}
.screen.on{display:flex}
h1{font-size:24px;margin:0}
.soft{color:var(--soft)}
.btn{background:var(--pri);color:#fff;font-weight:700;font-size:18px;padding:14px 20px;border-radius:16px;box-shadow:0 4px 0 var(--pri2);width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri2)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.green{background:var(--ok);box-shadow:0 4px 0 var(--ok2)}
.btn.sm{font-size:15px;padding:10px 14px;border-radius:13px;width:auto}
.btn[disabled]{opacity:.45}
.x{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--line);font-size:20px;flex:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:14px;border-radius:9px;background:#dfe2f4;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7b7ef8,var(--pri));border-radius:9px;transition:width .3s}
/* Start */
.stats{display:flex;gap:8px;margin-left:auto}.stat{background:#fff;border-radius:14px;padding:7px 11px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,#6e71f7,#4144d6);color:#fff;border-radius:22px;padding:16px;margin:6px 0 10px;box-shadow:0 4px 0 #3033b0}
.hero .em{font-size:38px;width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.hero b{display:block;font-size:20px}.hero span{opacity:.9;font-size:14px}
.hero.alt{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}.hero.alt .em{background:#fff3d6}
h2{font-size:17px;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lcard{background:#fff;border-radius:18px;padding:12px;text-align:left;box-shadow:0 3px 0 var(--line);display:flex;gap:10px;align-items:center}
.lcard:active{transform:translateY(2px)}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;background:conic-gradient(var(--ok) calc(var(--p)*1%),#e6e8f6 0)}
.ring span{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center}
.lcard b{display:block}.lcard small{color:var(--soft)}
.foot{margin-top:auto;padding-top:16px;text-align:center;color:var(--soft);font-size:12px}
/* Blatt */
.sheet{display:none;position:fixed;inset:0;background:rgba(35,38,74,.5);z-index:9;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet>div{background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px 22px;width:100%;max-width:560px;max-height:88%;overflow:auto}
.sheet .btn{margin-top:10px}
.wl{list-style:none;padding:0;margin:12px 0 0}.wl li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 10px;margin-bottom:6px}
.wl .ic{width:40px;height:40px;flex:none}.wl b{display:block}.wl small{color:var(--soft)}.wl button{margin-left:auto;font-size:20px;width:40px;height:40px;border-radius:50%;background:#eef0ff}
/* Übungen */
#ex{flex:1;display:flex;flex-direction:column}
.task{font-weight:700;color:var(--soft);margin:2px 0 10px}
.qcard{background:var(--card);border-radius:24px;padding:14px;text-align:center;box-shadow:0 3px 0 var(--line);margin-bottom:14px}
.qcard .ico{width:min(40vw,160px);height:min(40vw,160px);margin:0 auto}
.qword{font-size:30px;font-weight:800;margin:6px 0 2px;overflow-wrap:anywhere}
.qsub{color:var(--soft);font-size:17px}
.spk{margin-top:8px;background:#eef0ff;color:var(--pri);padding:9px 16px;border-radius:30px;font-weight:700}
.spk.big{width:110px;height:110px;border-radius:50%;font-size:46px;margin:14px auto;display:block}
.opts{display:grid;gap:10px}
.opt{background:#fff;border-radius:18px;padding:15px 12px;font-size:19px;font-weight:700;box-shadow:0 4px 0 var(--line);border:2px solid transparent;text-align:center;overflow-wrap:anywhere}
.opt:active{transform:translateY(2px)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.dim{opacity:.5}.opt.sel{border-color:var(--pri);background:#eef0ff}
.opts.pics{grid-template-columns:repeat(3,1fr)}.opts.pics .opt{padding:8px}
.opts.pairs{grid-template-columns:1fr 1fr}.opts.pairs .opt{font-size:17px;padding:13px 8px}
.slots{min-height:58px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;border-bottom:3px solid var(--line);padding:6px 0;margin-bottom:14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:44px;height:48px;padding:0 10px;border-radius:12px;background:#fff;box-shadow:0 3px 0 var(--line);font-size:22px;font-weight:800}
.tile.used{visibility:hidden}
.fbar{position:sticky;bottom:0;margin:14px -16px -16px;padding:14px 16px 18px;border-radius:20px 20px 0 0;display:none}
.fbar.ok{display:block;background:var(--okbg)}.fbar.bad{display:block;background:var(--badbg)}
.fbar b{font-size:19px}.fbar.ok b{color:var(--ok2)}.fbar.bad b{color:var(--bad)}.fbar p{margin:4px 0 10px}
.fbar.bad .btn{background:var(--bad);box-shadow:0 4px 0 #c22a47}
/* Sprechen */
.stage{background:var(--card);border-radius:26px;padding:18px;text-align:center;box-shadow:0 3px 0 var(--line);flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:300px}
.orb{width:120px;height:120px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:48px;background:#eef0ff;transition:transform .08s,background .2s}
.orb.listen{background:#d3f9e8}.orb.speak{background:#ffe9b3;animation:talk .7s infinite alternate}.orb.wait{animation:spin 1.2s linear infinite;background:#eef0ff}
@keyframes talk{to{transform:scale(1.08)}}@keyframes spin{50%{opacity:.5}}
.state{font-weight:700;color:var(--soft)}
.vprompt{font-size:34px;font-weight:800;min-height:44px;overflow-wrap:anywhere}
.vhint{font-size:24px;letter-spacing:2px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--pri);min-height:30px}
.pic{width:110px;height:110px;margin:0 auto}
.cap{color:var(--soft);min-height:44px;font-size:16px}
.vrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}.vrow .btn{padding:12px 4px;font-size:15px}
.notice{background:#fff7e0;border:2px solid #ffe08a;border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0}
.stars{font-size:54px;letter-spacing:6px;text-align:center;margin:18px 0 8px}
.sum{background:#fff;border-radius:22px;padding:18px;text-align:center;margin-bottom:16px;box-shadow:0 3px 0 var(--line)}.sum b{font-size:26px}
label.h{font-weight:700;margin:12px 0 4px;display:block}
input.f,select.f{width:100%;font:inherit;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff}
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="top"><h1>🏛️ Latein</h1><div class="stats"><span class="stat" id="stStreak">🔥 0</span><span class="stat" id="stXp">⭐ 0</span><button class="stat" id="goSet">⚙️</button></div></div>
  <button class="hero" id="goTalk"><span class="em">🎤</span><div><b>Sprech-Training</b><span>Lena fragt dich ab, du antwortest laut</span></div></button>
  <button class="hero alt" id="goRev"><span class="em">🔁</span><div><b>Wiederholen</b><span id="revInfo"></span></div></button>
  <h2>Lektionen</h2>
  <div class="grid" id="grid"></div>
  <p class="foot" id="ver"></p>
</section>

<section id="learn" class="screen">
  <div class="top"><button class="x" id="lClose">✕</button><div class="bar"><i id="lBar"></i></div></div>
  <div id="ex"></div>
  <div class="fbar" id="fbar"><b id="fbT"></b><p id="fbS"></p><button class="btn green" id="fbNext">Weiter</button></div>
</section>

<section id="talk" class="screen">
  <div class="top"><button class="x" id="tClose">✕</button><div class="bar"><i id="tBar"></i></div><b class="soft" id="tCnt"></b></div>
  <div class="stage">
    <div class="orb" id="orb">🎤</div>
    <div class="state" id="tState"></div>
    <div class="vprompt" id="tPrompt"></div>
    <div class="vhint" id="tHint"></div>
    <div class="pic" id="tPic"></div>
    <div class="cap" id="tCap"></div>
  </div>
  <div class="vrow"><button class="btn ghost" id="bHint">💡 Tipp</button><button class="btn ghost" id="bRepeat">🔁 Nochmal</button><button class="btn ghost" id="bGive">🤷 Weiß nicht</button></div>
  <div class="notice" id="tNotice" style="display:none"></div>
</section>

<section id="end" class="screen">
  <h1 style="text-align:center;margin-top:20px">Geschafft!</h1>
  <div class="stars" id="eStars"></div>
  <div class="sum"><b id="eMain"></b><p id="eSub" class="soft" style="margin:6px 0 0"></p></div>
  <button class="btn" id="eHome">Weiter</button>
</section>

<section id="settings" class="screen">
  <div class="top"><button class="x" id="sBack">←</button><h1>Elternbereich</h1></div>
  <label class="h">Gemini-Schlüssel</label>
  <input class="f" id="sKey" type="password" autocomplete="off" placeholder="Schlüssel einfügen">
  <button class="btn ghost sm" id="sTest" style="margin-top:8px">Verbindung testen</button> <b id="sMsg"></b>
  <label class="h">Stimme</label>
  <select class="f" id="sVoice"></select>
  <button class="btn ghost sm" id="sProbe" style="margin-top:8px">Probe hören</button>
  <label class="h">Aufnahmen der lateinischen Wörter</label>
  <p class="soft" id="sClips" style="margin:0 0 8px"></p>
  <button class="btn ghost sm" id="sLoad">Alle Aufnahmen laden</button>
  <p class="notice">Der Schlüssel bleibt nur auf diesem Gerät. Beim Sprech-Training geht die Stimme an Google. Googles Bedingungen sehen die Schnittstelle nicht für Apps vor, die Kinder nutzen. Die Entscheidung liegt bei dir.</p>
  <button class="btn ghost sm" id="sReset">Lernfortschritt zurücksetzen</button>
</section>

<div id="toast" style="display:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#23264a;color:#fff;padding:10px 16px;border-radius:30px;font-weight:700;font-size:14px;z-index:20"></div>
<div class="sheet" id="sheet"><div>
  <div class="top"><h1 id="shT"></h1><button class="x" id="shX" style="margin-left:auto">✕</button></div>
  <p class="soft" id="shInfo" style="margin:0"></p>
  <button class="btn" id="shLearn">Lernen</button>
  <button class="btn ghost" id="shTalk">🎤 Abfragen lassen</button>
  <ul class="wl" id="shList"></ul>
</div></div>

<script src="vocab.js?v=22"></script>
<script src="logic.js?v=22"></script>
<script src="icons.js?v=22"></script>
<script src="gem.js?v=22"></script>
<script src="app.js?v=22"></script>
</body>
</html>
